id: io.github.nolight132.sonora

runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable

command: sonora
finish-args:
  - --socket=wayland # Permission needed to show the window
  - --socket=fallback-x11 # Permission needed to show the window on legacy windowing systems
  - --socket=x11 # Required for copy to clipboard button to work
  - --socket=pulseaudio # Play audio
  - --device=dri # GPU acceleration
  - --share=network # Internet access
  - --share=ipc
  - --filesystem=xdg-music:ro
  - --filesystem=xdg-run/pipewire-0:ro # Spotify flatpak has this

  # Session Bus Permissions (Same as Spotify flatpak):
  - --talk-name=org.gnome.SettingsDaemon.MediaKeys
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.kde.StatusNotifierWatcher

modules:
  - name: sonora
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/sonora/cargo
        CARGO_NET_OFFLINE: 'true'
    sources:
      # Use source from GitHub:
      #- type: git
      #  url: https://github.com/nolight132/sonora.git
      #  tag: v0.28.0

      # Use source from this machine:
      - type: dir
        path: ..
        skip:
        - .git
        - target
        - dist

      # Sources to build with Cargo:
      - cargo-sources.json
    build-commands:
      # Symlink/move cargo/config to config.toml to fix deprecation warning
      - test -f cargo/config && mv cargo/config cargo/config.toml || true

      # Build directly - Cargo will automatically use $CARGO_HOME/config
      - cargo build --offline --release

      # Collect info as suggested by: https://v2.tauri.app/distribute/flatpak/
      # Install binary to /app/bin
      - install -Dm755 "target/release/sonora" /app/bin/sonora

      # Install desktop icons
      - install -Dm644 assets/linux/icons/hicolor/32x32/apps/sonora.png /app/share/icons/hicolor/32x32/apps/io.github.nolight132.sonora.png
      - install -Dm644 assets/linux/icons/hicolor/64x64/apps/sonora.png /app/share/icons/hicolor/64x64/apps/io.github.nolight132.sonora.png
      - install -Dm644 assets/linux/icons/hicolor/128x128/apps/sonora.png /app/share/icons/hicolor/128x128/apps/io.github.nolight132.sonora.png
      - install -Dm644 assets/linux/icons/hicolor/512x512/apps/sonora.png /app/share/icons/hicolor/512x512/apps/io.github.nolight132.sonora.png

      # Install Desktop File and AppData Metainfo
      - install -Dm644 flatpak/io.github.nolight132.sonora.desktop /app/share/applications/io.github.nolight132.sonora.desktop
      - install -Dm644 flatpak/io.github.nolight132.sonora.metainfo.xml /app/share/metainfo/io.github.nolight132.sonora.metainfo.xml
