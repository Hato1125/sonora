name: windows check

on:
  push:
    branches: [feat/fullscreen-player]
    paths: [.github/workflows/windows-check.yml]
  workflow_dispatch:

jobs:
  build:
    name: x86_64-pc-windows-msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-check

      - name: Build
        run: cargo build --release --locked --package sonora --target x86_64-pc-windows-msvc
