[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
audio = { path = "crates/audio" }
spotify = { path = "crates/spotify" }
state = { path = "crates/state" }
input = { path = "crates/input" }
ui = { path = "crates/ui" }
views = { path = "crates/views" }
workspace = { path = "crates/workspace" }

anyhow = "1.0"
async-trait = "0.1"
bytes = "1"
cpal = "0.16"
dirs = "6.0"
env_logger = "0.11"
gpui = { git = "https://github.com/zed-industries/zed", rev = "f25b256f2c10e1b638031a3d8d5a524056ebf268" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "f25b256f2c10e1b638031a3d8d5a524056ebf268", features = [
  "font-kit",
  "wayland",
  "x11",
] }
http = "1.3"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls-native-roots",
] }
rodio = { version = "0.21", default-features = false, features = ["playback"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

librespot-core = { version = "0.8.0", default-features = false, features = [
  "rustls-tls-native-roots",
] }
librespot-oauth = { version = "0.8.0", default-features = false, features = [
  "rustls-tls-native-roots",
] }
librespot-playback = { version = "0.8.0", default-features = false, features = [
  "rodio-backend",
  "rustls-tls-native-roots",
] }
librespot-protocol = "0.8.0"
protobuf = "3"
tokio = { version = "1.53", features = [
  "rt-multi-thread",
  "net",
  "io-util",
  "macros",
] }

[profile.dev]
split-debuginfo = "unpacked"


[profile.dev.package."*"]
debug = false
opt-level = 2
