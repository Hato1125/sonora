[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/nolight132/sonora"

[workspace.dependencies]
i18n = { path = "crates/i18n" }
music = { path = "crates/music" }
state = { path = "crates/state" }
input = { path = "crates/input" }
router = { path = "crates/router" }
ui = { path = "crates/ui" }
views = { path = "crates/views" }

anyhow = "1.0"
async-trait = "0.1"
bytes = "1"
cpal = "0.16"
dirs = "6.0"
env_logger = "0.11"
fastrand = "2.5"
fluent-bundle = "0.16"
gpui = { git = "https://github.com/zed-industries/zed", rev = "f25b256f2c10e1b638031a3d8d5a524056ebf268" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "f25b256f2c10e1b638031a3d8d5a524056ebf268", features = [
  "font-kit",
  "wayland",
  "x11",
] }
http = "1.3"
winresource = "0.1"
interprocess = "2.4"
image = { version = "0.25", default-features = false }
jiff = { version = "0.2", default-features = false, features = ["std"] }
libc = "0.2"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls-native-roots",
] }
raw-window-handle = "0.6"
rodio = { version = "0.21", default-features = false, features = ["playback"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
souvlaki = "0.8"
sys-locale = "0.3"
unic-langid = { version = "0.9", features = ["macros"] }

librespot-core = { version = "0.8.0", default-features = false, features = [
  "rustls-tls-native-roots",
] }
librespot-oauth = { version = "0.8.0", default-features = false, features = [
  "rustls-tls-native-roots",
] }
librespot-playback = { version = "0.8.0", default-features = false, features = [
  "rodio-backend",
  "rustls-tls-native-roots",
] }
librespot-protocol = "0.8.0"
protobuf = "3"
tokio = { version = "1.53", features = [
  "rt-multi-thread",
  "net",
  "io-util",
  "macros",
  "sync",
] }

[profile.dev]
split-debuginfo = "unpacked"

[profile.dev.package.ui]
debug = false
opt-level = 2

[profile.dev.package.views]
debug = false
opt-level = 2

[profile.dev.package."*"]
debug = false
opt-level = 2
